<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥코 커스텀 스튜디오</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .login-card {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            text-align: center;
        }
        .login-card h2 {
            color: #ffcc00;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #555;
            background-color: #333;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-submit {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 15px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #ff8533;
        }
        .error-message {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 15px;
            display: none;
            font-weight: bold;
        }
        .result-panel {
            display: none;
            margin-top: 25px;
            background-color: #2a2a2a;
            border: 2px solid #555;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .result-panel h3 {
            color: #ff9900;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🐾 냥코 계정 인증</h2>
        
        <div class="input-group">
            <label for="inquiryCode">문의 코드 (Inquiry Code)</label>
            <input type="text" id="inquiryCode" placeholder="문의 코드 입력">
        </div>

        <div class="input-group">
            <label for="authPassword">인증 번호 (Password)</label>
            <input type="password" id="authPassword" placeholder="인증 번호 입력">
        </div>

        <button class="btn-submit" onclick="handleApply()">적용하기</button>
        
        <div id="errorMsg" class="error-message">코드,비번이 다릅니다</div>
    </div>

    <!-- 조건 충족 시 나타나는 하단 영역 -->
    <div id="resultPanel" class="result-panel">
        <h3>✅ 인증 완료</h3>
        <p>형식이 확인되었습니다.</p>
    </div>

    <script>
        function handleApply() {
            const code = document.getElementById('inquiryCode').value.trim();
            const pass = document.getElementById('authPassword').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const resultPanel = document.getElementById('resultPanel');

            // 예시: 특정 글자 수나 조건(예: 코드는 8자리 이상, 비밀번호는 비어있지 않음 등)을 만족해야만 통과하도록 설정
            // 실제 게임 서버와 대조하는 것은 웹브라우저 상에서 불가능하므로 형식 검사로 대체합니다.
            if (code.length < 8 || pass.length < 4) {
                errorMsg.innerText = "코드,비번이 다릅니다";
                errorMsg.style.display = "block";
                resultPanel.style.display = "none";
            } else {
                errorMsg.style.display = "none";
                resultPanel.style.display = "block";
            }
        }
    </script>

</body>
</html>
